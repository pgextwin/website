name: Verify published Pages / Step 14
on:
  push:
    branches:
      - main
  workflow_dispatch:
  repository_dispatch:
    types: [catalog-updated]
  schedule:
    - cron: "30 0 * * *" # 09:30 JST; not guaranteed at exact minute

permissions:
  contents: read

jobs:
  public-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out pinned website revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check live GitHub Pages and independent Landscape Registry
        run: |
          node --version
          node scripts/verify-published-pages.mjs
      - name: Verify published release assets, SHA-256 and Test Contract source
        run: node scripts/verify-catalog-release.mjs
      - name: Cross-check nine Catalog records against GitHub Release asset digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-fleet-releases.mjs
      - name: Verify rendered catalog, filters and mobile layout in headless Chrome
        run: |
          google-chrome --version
          node scripts/verify-published-ui.mjs
