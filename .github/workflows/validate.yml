name: Validate website

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - name: Check JavaScript syntax
        run: |
          node --check lifecycle.js
          node --check catalog-view.js
          node --check locale.js
          node --check app.js
          node --check landscape-view.js
          node --check landscape-app.js
          node --check scripts/verify-published-pages.mjs
          node --check scripts/verify-catalog-release.mjs
          node --check scripts/verify-fleet-releases.mjs
          node --check scripts/verify-published-ui.mjs

      - name: Run website tests
        run: node --test tests/*.test.js

  lifecycle-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out website
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Verify PostgreSQL lifecycle rules
        run: node --test tests/lifecycle.test.js
